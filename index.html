<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gear Gromz — Shared Fleet & Predictive Sizing Hub</title>
  <link rel="stylesheet" href="css/styles.css?v=1.1">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <!-- TOP APP BAR -->
  <header class="app-header">
    <div class="header-left">
      <span class="app-logo">⚙️</span>
      <div>
        <h1 class="app-title">Gear Gromz</h1>
        <p class="app-subtitle">Circle Fleet & Predictive Sizing</p>
      </div>
    </div>
    <div class="header-right">
      <button id="api-status-btn" class="api-status-pill">
        <span class="status-dot"></span>
        <span id="api-status-label">Demo Mode</span>
      </button>
    </div>
  </header>

  <!-- MAIN APP CONTAINER -->
  <main id="main-content" class="main-container">
    <!-- Views rendered dynamically via js/app.js -->
  </main>

  <!-- BOTTOM NAVIGATION BAR (PWA STANDARD) -->
  <nav class="bottom-nav">
    <a href="#" class="nav-item active" data-tab="dashboard">
      <span class="nav-icon">🚲</span>
      <span class="nav-label">Fleet</span>
    </a>
    <a href="#" class="nav-item" data-tab="groms">
      <span class="nav-icon">👦</span>
      <span class="nav-label">Groms</span>
    </a>
    <a href="#" class="nav-item" data-tab="consumables">
      <span class="nav-icon">📦</span>
      <span class="nav-label">Depot</span>
    </a>
    <a href="#" class="nav-item" data-tab="add">
      <span class="nav-icon">➕</span>
      <span class="nav-label">Add Gear</span>
    </a>
  </nav>

  <!-- MODAL DRAWER OVERLAY -->
  <div id="modal-overlay" class="modal-overlay">
    <div id="modal-content" class="modal-content">
      <!-- Modal body dynamically inserted -->
    </div>
  </div>

  <!-- CONSOLIDATED SCRIPT WITH CACHE-BUSTER -->
  <script src="js/app.js?v=1.1"></script>
</body>
</html>
